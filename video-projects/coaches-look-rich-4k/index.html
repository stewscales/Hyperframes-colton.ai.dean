<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coaches look rich — Stew Scales</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'Montserrat'; src: url('assets/fonts/montserrat-latin-wght.woff2') format('woff2'); font-weight: 100 900; font-style: normal; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }
    #coaches-look-rich { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0A0A0A; font-family: 'Montserrat', sans-serif; }
    #base { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1; }
    #front { position: absolute; inset: 0; z-index: 2; }
    body.capture, body.capture #coaches-look-rich { background: transparent; }      /* scripts/capture.js: the caption layer alone, on a transparent page, at 2x */
    .cap { position: absolute; left: 0; width: 1080px; top: 1160px; text-align: center; white-space: nowrap; font-weight: 700; font-size: 56px; line-height: 1.12; letter-spacing: -0.03em; color: #fff; opacity: 0;
           text-shadow: 0 2px 5px rgba(0,0,0,0.75), 0 0 20px rgba(0,0,0,0.6), 0 0 46px rgba(0,0,0,0.45); }
    .cap .hl { display: inline-block; background: #2F6FED; color: #fff; font-weight: 800; padding: 1px 14px 5px; margin: 0 3px; border-radius: 12px; text-shadow: none; box-shadow: 0 6px 20px rgba(0,0,0,0.35); }   /* key words: white on the brand-blue bar (blue type alone is too dim on his navy tee) */
  </style>
</head>
<body>

<div id="coaches-look-rich" data-composition-id="coaches-look-rich" data-start="0" data-width="1080" data-height="1920">

  <video id="base" data-start="0" data-duration="11.5333" data-track-index="0" src="assets/base.mp4" muted playsinline></video>
  <audio id="base-audio" data-start="0" data-duration="11.5333" data-track-index="1" src="assets/base.mp4" data-volume="1"></audio>

  <div id="front">
    <div id="cap0" class="cap" style="opacity:1"><span class="hl">Coaches</span> are so focused</div>
    <div id="cap1" class="cap">on trying to <span class="hl">look rich</span></div>
    <div id="cap2" class="cap">they've completely forgot</div>
    <div id="cap3" class="cap">how to build a <span class="hl">business</span></div>
    <div id="cap4" class="cap">Everyone's so focused</div>
    <div id="cap5" class="cap">on posting their</div>
    <div id="cap6" class="cap"><span class="hl">watches</span></div>
    <div id="cap7" class="cap">and their <span class="hl">cars</span></div>
    <div id="cap8" class="cap">and their <span class="hl">lifestyle</span></div>
    <div id="cap9" class="cap"><span class="hl">none of it</span> actually matters</div>
    <div id="cap10" class="cap">because the content</div>
    <div id="cap11" class="cap"><span class="hl">isn't converting</span></div>
  </div>

    tl.fromTo("#cap1", { y: 14, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.18, ease: "power3.out", immediateRender: false }, 1.6323);

    tl.fromTo("#cap5", { y: 14, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.18, ease: "power3.out", immediateRender: false }, 5.799);

    tl.set("#cap6", { opacity: 0 }, 7.2657);

    tl.fromTo("#cap7", { y: 14, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.18, ease: "power3.out", immediateRender: false }, 7.2657);

    tl.set("#cap9", { opacity: 0 }, 9.999);
    tl.set("#cap10", { opacity: 1 }, 9.999);
    tl.fromTo("#cap10", { y: 14, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.18, ease: "power3.out", immediateRender: false }, 9.999);

    tl.set("#cap11", { opacity: 1 }, 10.7323);
    tl.fromTo("#cap11", { y: 14, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.18, ease: "power3.out", immediateRender: false }, 10.7323);
    tl.set({}, {}, 11.5333);

</html>
