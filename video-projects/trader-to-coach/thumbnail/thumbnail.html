<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Trader to Coach — thumbnail</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('../assets/fonts/inter-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url('../assets/fonts/inter-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 900; src: url('../assets/fonts/inter-latin-900-normal.woff2') format('woff2'); }
  :root { --blue: #2F6FED; --bone: #F2EFE9; --black: #0A0A0A; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  #thumb { position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: 'Inter', sans-serif; color: var(--bone);
    background:
      radial-gradient(ellipse 620px 560px at 72% 42%, rgba(140,180,255,0.62), rgba(140,180,255,0) 70%),
      radial-gradient(ellipse 1200px 800px at 50% 50%, rgba(47,111,237,0) 55%, rgba(14,44,120,0.55) 100%),
      var(--blue); }
  /* faint grid: texture only */
  #grid { position: absolute; inset: 0; opacity: 0.09;
    background-image: linear-gradient(var(--bone) 2px, transparent 2px), linear-gradient(90deg, var(--bone) 2px, transparent 2px);
    background-size: 80px 80px; background-position: -1px -1px;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 45%, transparent 85%); mask-image: linear-gradient(90deg, #000 0%, #000 45%, transparent 85%); }
  #person { position: absolute; left: 462px; top: -18px; width: 1056px; height: 864px; filter: drop-shadow(0 20px 36px rgba(6, 20, 64, 0.5)); }
  #copy { position: absolute; left: 58px; top: 96px; }
  .tag { display: inline-flex; align-items: center; gap: 14px; padding: 12px 24px 13px; border-radius: 999px; background: var(--black);
    font-weight: 800; font-size: 30px; letter-spacing: 0.12em; }
  .tag svg { width: 40px; height: 22px; }
  h1 { margin-top: 26px; font-weight: 900; font-size: 132px; line-height: 0.98; letter-spacing: -0.045em; text-shadow: 0 7px 0 rgba(10, 26, 74, 0.55); white-space: nowrap; }
  h1 span { display: block; }
  h1 .q { display: inline-block; margin: 0 14px 0 -8px; padding: 0 20px 6px; border-radius: 16px; background: var(--bone); color: var(--blue); text-shadow: none;
    transform: rotate(-3deg); box-shadow: 0 8px 0 rgba(10, 26, 74, 0.55); }
  .sub { margin-top: 34px; display: inline-flex; align-items: center; gap: 16px; font-weight: 800; font-size: 36px; letter-spacing: -0.01em; }
  .sub i { display: inline-block; width: 46px; height: 46px; border-radius: 12px; background: var(--bone); color: var(--blue); font-style: normal; font-weight: 900; font-size: 30px;
    display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="thumb">
  <div id="grid"></div>
  <img id="person" src="person.png" alt="" />
  <div id="copy">
    <div class="tag">TRADER <svg viewBox="0 0 40 22"><path d="M2 11h32M25 2l10 9-10 9" fill="none" stroke="#F2EFE9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg> COACH</div>
    <h1><span>MOST</span><span><b class="q">QUIT</b>IN</span><span>90 DAYS</span></h1>
    <div class="sub"><i><svg viewBox="0 0 32 32" width="30" height="30"><path d="M5 16h20M17 8l8 8-8 8" fill="none" stroke="#2F6FED" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></i> THE 3-PHASE FIX</div>
  </div>
</div>
</body>
</html>
